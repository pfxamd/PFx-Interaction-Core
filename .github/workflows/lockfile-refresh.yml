name: Refresh Core lockfile

"on":
  push:
    branches: [chore/extract-playground]

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[lockfile-generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit new lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh core-only lockfile [lockfile-generated]"
          git push origin HEAD:chore/extract-playground
