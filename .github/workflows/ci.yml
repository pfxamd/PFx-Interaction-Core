name: CI

"on":
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm api:extract
      - run: pnpm check:packages
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e

  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish one-time GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-beta.1 >/dev/null 2>&1; then
            echo "Already released"
            exit 0
          fi
          gh release create v0.1.0-beta.1 --target "$GITHUB_SHA" \
            --title "PFx Interaction Core v0.1.0-beta.1" \
            --notes-file RELEASE_NOTES.md --prerelease
